description: This dataset contains fiber photometry recordings from substantia nigra
  reticulata (SNr) GABAergic neurons in freely moving mice during optogenetic stimulation
  of excitatory inputs from the subthalamic nucleus (STN) or pedunculopontine nucleus
  (PPN). The data support the research findings published in 'Parkinson's Disease-vulnerable
  and -resilient dopamine neurons display opposite responses to excitatory input'
  (Hadjas et al., 2025).Dual transgenic mice (VGLUT2-Cre/VGAT-Flp) were used to selectively
  express GCaMP6f in SNr GABAergic neurons and ChrimsonR in glutamatergic neurons
  of either STN or PPN. Fiber photometry recordings were performed using a Tucker
  Davis Technologies (TDT) system with 465nm and 405nm (isosbestic control) LED excitation.
  The dataset includes optogenetic stimulation protocols with varying frequencies
  (5-40 Hz) and durations (250ms, 1s, 4s), as well as behavioral video recordings.
